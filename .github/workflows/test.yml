name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RPC_1: ${{ secrets.RPC_1 }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build
        run: |
          forge --version
          forge build --sizes --skip Mock Utils test
        id: build

      - name: Run tests
        run: forge test -vvv
        id: test
