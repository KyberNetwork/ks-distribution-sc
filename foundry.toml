[profile.default]
optimizer = true
optimizer_runs = 44444444
via_ir = true
ffi = true
fs_permissions = [{ access = 'read-write', path = './'}]

[lint]
lint_on_build = false

[fmt]
line_length = 100
tab_width = 2
quote_style = 'single'
number_underscore = 'thousands'
sort_imports = true

[rpc_endpoints]
mainnet = '${RPC_1}'

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
